<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>F1 TURBO X - Cyberpunk Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            background: #0a0a14;
            box-shadow: 0 0 20px rgba(0, 255, 242, 0.2);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
            opacity: 0;
        }
        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #00fff2;
            text-shadow: 0 0 15px rgba(0, 255, 242, 0.6), 0 0 30px rgba(255, 0, 127, 0.3);
            font-style: italic;
        }
        .panel {
            background: rgba(15, 15, 30, 0.85);
            border: 2px solid #ff007f;
            border-radius: 12px;
            padding: 25px;
            width: 80%;
            max-width: 700px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width {
            grid-column: span 2;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #8f93b5;
            letter-spacing: 1px;
        }
        select, button {
            background: #121225;
            border: 1px solid #00fff2;
            color: #fff;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }
        select:focus, button:hover {
            background: #00fff2;
            color: #05050a;
            box-shadow: 0 0 12px rgba(0, 255, 242, 0.5);
        }
        .btn-prime {
            background: #ff007f;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .btn-prime:hover {
            background: #fff;
            color: #ff007f;
            box-shadow: 0 0 15px #fff;
        }
        /* HUD Layout */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }
        .hud-card {
            background: rgba(10, 10, 20, 0.7);
            padding: 10px 20px;
            border-left: 4px solid #00fff2;
            border-radius: 0 8px 8px 0;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 5px #00fff2;
        }
        #btn-settings-trigger {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 6;
            background: rgba(10, 10, 20, 0.8);
            border: 1px solid #ff007f;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            pointer-events: auto;
        }
        /* Mobile Touch Controls Overlay */
        #touch-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: 4;
            display: none;
            justify-content: space-between;
            padding: 20px 40px;
            pointer-events: none;
        }
        .ctrl-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 242, 0.4);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: rgba(0, 255, 242, 0.6);
        }
        .ctrl-btn:active {
            background: rgba(0, 255, 242, 0.3);
            border-color: #00fff2;
            color: #fff;
        }
        .ctrl-group {
            display: flex;
            gap: 20px;
            pointer-events: none;
        }
        #countdown {
            position: absolute;
            font-size: 8rem;
            font-weight: 900;
            color: #ff007f;
            text-shadow: 0 0 30px #ff007f;
            z-index: 3;
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-screen" class="screen">
        <h1>F1 Turbo X</h1>
        <div class="panel">
            <div class="setting-group">
                <label>Select Car Type</label>
                <select id="select-car">
                    <option value="SPEED">SPEEDSTER (High Top Speed)</option>
                    <option value="TURBO">TURBO X (Fast Acceleration)</option>
                    <option value="GRIP">APEX GRIP (Better Handling)</option>
                    <option value="DRIFT">NEON DRIFT (Controlled Sliding)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Total Opponents</label>
                <select id="select-ai">
                    <option value="1">1 AI Car</option>
                    <option value="2">2 AI Cars</option>
                    <option value="3" selected>3 AI Cars</option>
                    <option value="4">4 AI Cars</option>
                    <option value="5">5 AI Cars</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Control Scheme</label>
                <select id="select-controls">
                    <option value="TOUCH">Touch D-Pad Buttons</option>
                    <option value="TILT">Device Tilt (Gyro)</option>
                    <option value="SWIPE">Swipe Gestures</option>
                </select>
            </div>
            <div class="setting-group">
                <label>AI Tactics</label>
                <select id="select-aggression">
                    <option value="OFF">Normal Racing (Clean)</option>
                    <option value="ON">Aggressive Mode (Blocks & Hits)</option>
                </select>
            </div>
            <button id="btn-start" class="btn-prime full-width">Launch Race</button>
        </div>
    </div>

    <div id="settings-modal" class="screen hidden">
        <h1>Settings Menu</h1>
        <div class="panel">
            <div class="setting-group full-width">
                <label>Change Control Scheme Dynamically</label>
                <select id="runtime-controls">
                    <option value="TOUCH">Touch D-Pad Buttons</option>
                    <option value="TILT">Device Tilt (Gyro)</option>
                    <option value="SWIPE">Swipe Gestures</option>
                </select>
            </div>
            <div class="setting-group full-width">
                <label>AI Behavioral Tactics</label>
                <select id="runtime-aggression">
                    <option value="OFF">Normal Racing</option>
                    <option value="ON">Aggressive Mode</option>
                </select>
            </div>
            <button id="btn-resume" class="btn-prime">Resume Race</button>
            <button id="btn-restart" class="btn-prime" style="background:#4e122b; border:1px solid #ff007f;">Quit to Menu</button>
        </div>
    </div>

    <button id="btn-settings-trigger" class="hidden">⚙️</button>
    <div id="hud" class="hidden">
        <div class="hud-card" id="hud-pos">POS: 1 / 4</div>
        <div class="hud-card" id="hud-lap">LAP: 1 / 3</div>
        <div class="hud-card" id="hud-speed">0 KM/H</div>
        <div class="hud-card" id="hud-coins">COINS: 0</div>
    </div>

    <div id="countdown">3</div>

    <div id="touch-overlay">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-brake">🛑</div>
            <div class="ctrl-btn" id="btn-gas">⚡</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
/**
 * F1 TURBO X - HIGH PERFORMANCE CANVAS CORE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Engine State Variables
let gameState = 'MENU'; 
let currentLevel = 1;
let totalLaps = 3;
let coinsCollected = 0;
let countdownVal = 3;
let isControllable = false;

// System Setup & Configuration
let config = {
    carType: 'SPEED',
    aiCount: 3,
    controlScheme: 'TOUCH',
    aiAggressive: 'OFF'
};

// Car Stats Configurations
const CAR_PRESETS = {
    SPEED: { topSpeed: 7.5, accel: 0.08, handling: 0.04, drift: 0.98 },
    TURBO: { topSpeed: 6.8, accel: 0.14, handling: 0.045, drift: 0.97 },
    GRIP:  { topSpeed: 6.5, accel: 0.09, handling: 0.065, drift: 0.99 },
    DRIFT: { topSpeed: 7.0, accel: 0.07, handling: 0.05, drift: 0.92 }
};

// Input Trackers
let inputs = { left: false, right: false, gas: false, brake: false };
let tiltAngle = 0;
let touchStartX = 0, touchStartY = 0;

// Setup Adaptive Viewport
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/**
 * MATH VECTOR MATH & GENERATIVE TRACK MAPS
 */
const TRACKS = {
    1: { // Level 1 Track Definition
        width: 140,
        points: [
            {x: 150, y: 150}, {x: 750, y: 150}, {x: 900, y: 300},
            {x: 900, y: 600}, {x: 650, y: 750}, {x: 350, y: 500},
            {x: 150, y: 650}
        ]
    },
    2: { // Level 2 Track Definition (More Tighter Corners)
        width: 110,
        points: [
            {x: 100, y: 100}, {x: 500, y: 100}, {x: 550, y: 350},
            {x: 900, y: 200}, {x: 950, y: 650}, {x: 600, y: 700},
            {x: 400, y: 450}, {x: 150, y: 600}
        ]
    }
};

// Global Instance Repositories
let playerCar;
let aiCars = [];
let roadWaypoints = [];
let coins = [];
let powerups = [];
let particles = [];

/**
 * ENTITY CLASS SCHEMATICS
 */
class Car {
    constructor(x, y, angle, isAI, type, index = 0) {
        this.x = x;
        this.y = y;
        this.xVelocity = 0;
        this.yVelocity = 0;
        this.speed = 0;
        this.angle = angle;
        this.isAI = isAI;
        this.type = type;
        this.index = index; // AI tracking slot
        
        // Load operational statistics
        let stats = CAR_PRESETS[type] || CAR_PRESETS.SPEED;
        this.topSpeed = stats.topSpeed;
        this.accel = stats.accel;
        this.handling = stats.handling;
        this.driftFactor = stats.drift;

        // Functional Status Attributes
        this.shieldActive = false;
        this.magnetActive = false;
        this.nitroTimer = 0;
        this.currentLap = 1;
        this.nextWaypointIndex = 1;
        this.lapCooldown = 0;
        this.color = isAI ? `hsl(${(index * 55) % 360}, 90%, 50%)` : '#00fff2';
        
        // Physical footprint dimensions
        this.width = 36;
        this.height = 18;
    }

    update() {
        // Handle Powerup Expirations
        if (this.nitroTimer > 0) this.nitroTimer--;
        
        let maxVel = this.nitroTimer > 0 ? this.topSpeed * 1.5 : this.topSpeed;

        if (!this.isAI && isControllable) {
            this.handlePlayerControls(maxVel);
        } else if (this.isAI && isControllable) {
            this.handleAIRacingLogic(maxVel);
        }

        // Apply Vector Friction & Velocity Physics
        this.speed *= this.driftFactor;
        if (Math.abs(this.speed) < 0.05) this.speed = 0;

        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        // Process Dynamic Smoke Emissions
        if (Math.abs(this.speed) > 3) {
            createParticle(this.x - Math.cos(this.angle)*15, this.y - Math.sin(this.angle)*15, '#3a3a4f', 3);
            if (this.nitroTimer > 0) {
                createParticle(this.x - Math.cos(this.angle)*18, this.y - Math.sin(this.angle)*18, '#ff007f', 6);
            }
        }

        // Keep Track Progress Tracking
        this.trackRacePosition();
    }

    handlePlayerControls(maxVel) {
        // Speed Processors
        if (inputs.gas) {
            this.speed = Math.min(this.speed + this.accel, maxVel);
        } else if (inputs.brake) {
            this.speed = Math.max(this.speed - this.accel * 1.5, -maxVel * 0.3);
        } else {
            this.speed *= 0.96;
        }

        // Steering Engine Switchboard
        let turnSpeed = this.handling * (this.speed / this.topSpeed + 0.1);
        if (config.controlScheme === 'TILT') {
            this.angle += tiltAngle * 0.05;
        } else {
            if (inputs.left) this.angle -= turnSpeed;
            if (inputs.right) this.angle += turnSpeed;
        }
    }

    handleAIRacingLogic(maxVel) {
        let target = roadWaypoints[this.nextWaypointIndex];
        if (!target) return;

        // Check if destination waypoint is reached
        let dx = target.x - this.x;
        let dy = target.y - this.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 80) {
            this.nextWaypointIndex = (this.nextWaypointIndex + 1) % roadWaypoints.length;
        }

        // Aggressive Blocking & Ramming Vector Overrides
        if (config.aiAggressive === 'ON' && playerCar && Math.random() < 0.2) {
            let pDist = Math.hypot(playerCar.x - this.x, playerCar.y - this.y);
            if (pDist < 200) { // Override targeting directly onto player path
                dx = playerCar.x - this.x;
                dy = playerCar.y - this.y;
            }
        }

        let targetAngle = Math.atan2(dy, dx);
        let angleDiff = targetAngle - this.angle;

        // Normalize Angle Ranges
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

        // AI Angular adjustment
        this.angle += Math.sign(angleDiff) * Math.min(this.handling * 0.8, Math.abs(angleDiff));

        // Speed Logic
        this.speed = Math.min(this.speed + this.accel * 0.9, maxVel * 0.85);
    }

    trackRacePosition() {
        if (this.lapCooldown > 0) this.lapCooldown--;

        // Vector measurement against track zero waypoint (Start line)
        let startPoint = roadWaypoints[0];
        let d = Math.hypot(this.x - startPoint.x, this.y - startPoint.y);

        if (d < 90 && this.lapCooldown === 0) {
            if (this.nextWaypointIndex > roadWaypoints.length / 2) {
                this.currentLap++;
                this.lapCooldown = 150; // Prevent duplicate multi-lap triggers
                if (!this.isAI && this.currentLap > totalLaps) {
                    executeRaceEnd(true);
                }
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Neon Glow Profiling
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;

        // Draw Formula 1 Detailed Wheels Layout
        ctx.fillStyle = '#111';
        ctx.fillRect(-14, -13, 8, 5);  // Front Left
        ctx.fillRect(-14, 8, 8, 5);   // Front Right
        ctx.fillRect(8, -14, 9, 6);    // Rear Left
        ctx.fillRect(8, 8, 9, 6);     // Rear Right

        // Main F1 High Performance Aerodynamic Casing
        ctx.fillStyle = this.color;
        ctx.fillRect(-15, -8, 30, 16); 
        
        // Front Wing Structure
        ctx.fillStyle = '#222';
        ctx.fillRect(-18, -11, 4, 22);
        // Rear Spoiler Wing
        ctx.fillRect(14, -12, 3, 24);

        // Drivers Glass Cockpit Pod
        ctx.fillStyle = '#fff';
        ctx.fillRect(-4, -4, 8, 8);

        // Draw Buff Active States
        if (this.shieldActive) {
            ctx.strokeStyle = '#e200ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI*2);
            ctx.stroke();
        }

        ctx.restore();
    }
}

/**
 * ENVIRONMENTAL DYNAMICS & POWERUP GENERATORS
 */
class Collectible {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'COIN', 'NITRO', 'SHIELD', 'MAGNET'
        this.pulse = 0;
    }

    update() {
        this.pulse += 0.08;
        
        // Magnet mechanics processing loop
        if (playerCar && playerCar.magnetActive && this.type === 'COIN') {
            let dist = Math.hypot(playerCar.x - this.x, playerCar.y - this.y);
            if (dist < 180) {
                this.x += (playerCar.x - this.x) * 0.08;
                this.y += (playerCar.y - this.y) * 0.08;
            }
        }
    }

    draw() {
        ctx.save();
        ctx.shadowBlur = 10;
        let size = 8 + Math.sin(this.pulse) * 2;

        if (this.type === 'COIN') {
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffd700';
            ctx.beginPath();
            ctx.arc(this.x, this.y, size, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.lineWidth = 2;
            if (this.type === 'NITRO') { ctx.fillStyle = '#ff007f'; ctx.shadowColor = '#ff007f'; }
            if (this.type === 'SHIELD') { ctx.fillStyle = '#00fff2'; ctx.shadowColor = '#00fff2'; }
            if (this.type === 'MAGNET') { ctx.fillStyle = '#a100ff'; ctx.shadowColor = '#a100ff'; }
            
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - size);
            ctx.lineTo(this.x + size, this.y + size);
            ctx.lineTo(this.x - size, this.y + size);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }
}

function createParticle(x, y, color, size) {
    particles.push({
        x: x, y: y,
        xv: (Math.random() - 0.5) * 2,
        yv: (Math.random() - 0.5) * 2,
        size: size,
        life: 1.0,
        color: color
    });
}

/**
 * HIGH CONCURRENCY TRACK BUILDER
 */
function interpolateWaypoints() {
    roadWaypoints = [];
    let track = TRACKS[currentLevel];
    let pts = track.points;

    for (let i = 0; i < pts.length; i++) {
        let p1 = pts[i];
        let p2 = pts[(i + 1) % pts.length];

        // Fill up spacing segments dynamically to structure smooth coordinates mapping
        let segments = 35;
        for (let s = 0; s < segments; s++) {
            let t = s / segments;
            let nx = p1.x * (1 - t) + p2.x * t;
            let ny = p1.y * (1 - t) + p2.y * t;
            roadWaypoints.push({ x: nx, y: ny });
        }
    }
}

function renderTrackCasing() {
    let track = TRACKS[currentLevel];
    
    // Draw Safe Asphalt Underlayer Foundation Strip
    ctx.strokeStyle = '#141428';
    ctx.lineWidth = track.width + 16;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    roadWaypoints.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.stroke();

    // Draw Cyberpunk High Vis Glowing Boundary Rails
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = track.width;
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#ff0055';
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Inside Matte Driveable Lane
    ctx.strokeStyle = '#0d0d1a';
    ctx.lineWidth = track.width - 8;
    ctx.stroke();

    // Finish Grid Mesh Overlay Indicator
    let start = roadWaypoints[0];
    let next = roadWaypoints[1];
    let angle = Math.atan2(next.y - start.y, next.x - start.x);
    
    ctx.save();
    ctx.translate(start.x, start.y);
    ctx.rotate(angle);
    ctx.fillStyle = '#fff';
    for (let j = -track.width/2; j < track.width/2; j += 12) {
        ctx.fillRect(0, j, 6, 6);
        ctx.fillRect(6, j + 6, 6, 6);
    }
    ctx.restore();
}

/**
 * ENGINE LIFECYCLE CONTROLLERS & RIGGING
 */
function initializeRaceRuntime() {
    interpolateWaypoints();
    
    // Spawn Player
    let startPoint = roadWaypoints[0];
    let nextPoint = roadWaypoints[1];
    let initAngle = Math.atan2(nextPoint.y - startPoint.y, nextPoint.x - startPoint.x);
    
    playerCar = new Car(startPoint.x, startPoint.y + 15, initAngle, false, config.carType);
    
    // Clear & Populate AI Registry
    aiCars = [];
    for (let i = 0; i < parseInt(config.aiCount); i++) {
        let offsetSpacing = -25 - (i * 20);
        let ai = new Car(startPoint.x + Math.sin(initAngle)*offsetSpacing, startPoint.y - Math.cos(initAngle)*offsetSpacing, initAngle, true, 'SPEED', i+1);
        aiCars.push(ai);
    }

    // Populate Level Loot Safely on Road Centers
    coins = [];
    powerups = [];
    particles = [];
    coinsCollected = 0;

    for (let step = 10; step < roadWaypoints.length; step += 15) {
        let wp = roadWaypoints[step];
        if (Math.random() < 0.6) {
            coins.push(new Collectible(wp.x + (Math.random()-0.5)*30, wp.y + (Math.random()-0.5)*30, 'COIN'));
        } else if (Math.random() < 0.12) {
            let types = ['NITRO', 'SHIELD', 'MAGNET'];
            let randomType = types[Math.floor(Math.random() * types.length)];
            powerups.push(new Collectible(wp.x, wp.y, randomType));
        }
    }

    // Trigger UI Viewports Switches
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('settings-modal').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('btn-settings-trigger').classList.remove('hidden');

    if (config.controlScheme === 'TOUCH') {
        document.getElementById('touch-overlay').style.display = 'flex';
    } else {
        document.getElementById('touch-overlay').style.display = 'none';
    }

    // Initialize Race Launch Counter Sequencer
    runCountdownSequence();
}

function runCountdownSequence() {
    isControllable = false;
    countdownVal = 3;
    let el = document.getElementById('countdown');
    el.style.display = 'block';
    el.innerText = countdownVal;

    let timer = setInterval(() => {
        countdownVal--;
        if (countdownVal === 0) {
            el.innerText = "GO!";
            isControllable = true;
        } else if (countdownVal < 0) {
            clearInterval(timer);
            el.style.display = 'none';
        } else {
            el.innerText = countdownVal;
        }
    }, 1000);
}

/**
 * COLLISION MATRIX CALCULATORS
 */
function checkPhysicsCollisions() {
    let trackWidth = TRACKS[currentLevel].width;

    // Process Player boundaries against Track boundaries
    let insideTrack = false;
    for (let i = 0; i < roadWaypoints.length; i++) {
        let dist = Math.hypot(playerCar.x - roadWaypoints[i].x, playerCar.y - roadWaypoints[i].y);
        if (dist < trackWidth / 2) {
            insideTrack = true;
            break;
        }
    }

    // Penalize off-road drift behavior
    if (!insideTrack && !playerCar.shieldActive) {
        playerCar.speed = Math.max(playerCar.speed * 0.85, 1.5);
        createParticle(playerCar.x, playerCar.y, '#ff0055', 4);
    }

    // Check Loot Triggers (Coins)
    for (let i = coins.length - 1; i >= 0; i--) {
        let d = Math.hypot(playerCar.x - coins[i].x, playerCar.y - coins[i].y);
        if (d < 25) {
            coins.splice(i, 1);
            coinsCollected += 10;
            continue;
        }
    }

    // Check Buff Items pickup Triggers
    for (let i = powerups.length - 1; i >= 0; i--) {
        let d = Math.hypot(playerCar.x - powerups[i].x, playerCar.y - powerups[i].y);
        if (d < 25) {
            let picked = powerups[i].type;
            powerups.splice(i, 1);

            if (picked === 'NITRO') playerCar.nitroTimer = 180;
            if (picked === 'SHIELD') {
                playerCar.shieldActive = true;
                setTimeout(() => playerCar.shieldActive = false, 5000);
            }
            if (picked === 'MAGNET') {
                playerCar.magnetActive = true;
                setTimeout(() => playerCar.magnetActive = false, 7000);
            }
        }
    }

    // Process Vehicle Inter-Collision Engine (Player vs AI)
    aiCars.forEach(ai => {
        let d = Math.hypot(playerCar.x - ai.x, playerCar.y - ai.y);
        if (d < 26) { // Intersection breach
            let angle = Math.atan2(playerCar.y - ai.y, playerCar.x - ai.x);
            
            if (!playerCar.shieldActive) {
                playerCar.speed *= 0.6;
                playerCar.x += Math.cos(angle) * 12;
                playerCar.y += Math.sin(angle) * 12;
            }
            ai.speed *= 0.5;
            
            // Generate visual spark effects
            for(let k=0; k<8; k++) createParticle(playerCar.x, playerCar.y, '#fff', 5);
        }
    });
}

function executeRaceEnd(isWin) {
    isControllable = false;
    gameState = 'MENU';
    alert(isWin ? `VICTORY! Total Level Earnings: ${coinsCollected} Coins.` : "RACE OVER!");
    
    if (isWin && currentLevel === 1) {
        currentLevel = 2; // Auto advance to tighter level
    } else {
        currentLevel = 1;
    }
    
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('btn-settings-trigger').classList.add('hidden');
    document.getElementById('touch-overlay').style.display = 'none';
    document.getElementById('menu-screen').classList.remove('hidden');
}

/**
 * CENTRAL TICK EXECUTION LOOP
 */
function gameTickLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'RUNNING') {
        // Camera Tracking Target Assignment Matrix
        ctx.save();
        ctx.translate(canvas.width / 2 - playerCar.x, canvas.height / 2 - playerCar.y);

        // Core Render Pipeline Execution
        renderTrackCasing();
        
        coins.forEach(c => { c.update(); c.draw(); });
        powerups.forEach(p => { p.update(); p.draw(); });
        
        // Update & Render Actors
        playerCar.update();
        playerCar.draw();

        aiCars.forEach(ai => {
            ai.update();
            ai.draw();
        });

        // Compute Particle FX pipeline
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.xv; p.y += p.yv;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
            else {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1.0;
            }
        }

        ctx.restore();

        // Run Intersect Physics Calculators
        checkPhysicsCollisions();

        // Feed Realtime Updates to Active HUD Element Layers
        document.getElementById('hud-speed').innerText = `${Math.round(playerCar.speed * 32)} KM/H`;
        document.getElementById('hud-coins').innerText = `COINS: ${coinsCollected}`;
        document.getElementById('hud-lap').innerText = `LAP: ${playerCar.currentLap} / ${totalLaps}`;
        
        // Calculate Position placement ranking
        let rank = 1;
        aiCars.forEach(ai => {
            if (ai.currentLap > playerCar.currentLap) rank++;
            else if (ai.currentLap === playerCar.currentLap && ai.nextWaypointIndex > playerCar.nextWaypointIndex) rank++;
        });
        document.getElementById('hud-pos').innerText = `POS: ${rank} / ${aiCars.length + 1}`;
    }

    requestAnimationFrame(gameTickLoop);
}

/**
 * COMPREHENSIVE INPUT DRIVER HOOKS
 */
document.getElementById('btn-start').addEventListener('click', () => {
    config.carType = document.getElementById('select-car').value;
    config.aiCount = document.getElementById('select-ai').value;
    config.controlScheme = document.getElementById('select-controls').value;
    config.aiAggressive = document.getElementById('select-aggression').value;

    gameState = 'RUNNING';
    initializeRaceRuntime();
});

// Settings Overlay Management Triggers
const triggerBtn = document.getElementById('btn-settings-trigger');
const modal = document.getElementById('settings-modal');

triggerBtn.addEventListener('click', () => {
    gameState = 'PAUSED';
    isControllable = false;
    
    // Prefill currently assigned setup schema options dynamically
    document.getElementById('runtime-controls').value = config.controlScheme;
    document.getElementById('runtime-aggression').value = config.aiAggressive;
    
    modal.classList.remove('hidden');
});

document.getElementById('btn-resume').addEventListener('click', () => {
    config.controlScheme = document.getElementById('runtime-controls').value;
    config.aiAggressive = document.getElementById('runtime-aggression').value;
    
    if (config.controlScheme === 'TOUCH') {
        document.getElementById('touch-overlay').style.display = 'flex';
    } else {
        document.getElementById('touch-overlay').style.display = 'none';
    }

    modal.classList.add('hidden');
    gameState = 'RUNNING';
    isControllable = true;
});

document.getElementById('btn-restart').addEventListener('click', () => {
    modal.classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    triggerBtn.classList.add('hidden');
    document.getElementById('touch-overlay').style.display = 'none';
    gameState = 'MENU';
    document.getElementById('menu-screen').classList.remove('hidden');
});

// Control Mapping Layout Listeners (Keyboard Fallbacks for Desktop Tests)
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = true;
    if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = false;
    if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = false;
});

// Screen Overlay Touch Controllers Event Registrations
const bindTouch = (id, targetProp) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[targetProp] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[targetProp] = false; });
};
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-gas', 'gas');
bindTouch('btn-brake', 'brake');

// Motion Gyro API Driver Linkage
if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
        // Evaluate gamma tilt orientation values safely
        let tilt = e.gamma; // Range: [-90, 90]
        if (window.orientation === 90) tilt = -e.beta;
        else if (window.orientation === -90) tilt = e.beta;
        
        if(Math.abs(tilt) > 4) {
            tiltAngle = (tilt / 45); // Constrain normalized vector balance
        } else {
            tiltAngle = 0;
        }
    }, true);
}

// Global Swipe Gesture Analyzer Pipeline
window.addEventListener('touchstart', e => {
    if (config.controlScheme !== 'SWIPE') return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    inputs.gas = true; // Auto-accelerate when operating under swipe setups
}, {passive: true});

window.addEventListener('touchmove', e => {
    if (config.controlScheme !== 'SWIPE' || !touchStartX) return;
    let dx = e.touches[0].clientX - touchStartX;
    
    if (dx < -30) { inputs.left = true; inputs.right = false; }
    else if (dx > 30) { inputs.right = true; inputs.left = false; }
    else { inputs.left = false; inputs.right = false; }
}, {passive: true});

window.addEventListener('touchend', () => {
    if (config.controlScheme !== 'SWIPE') return;
    inputs.left = false;
    inputs.right = false;
    inputs.gas = false;
    touchStartX = 0;
});

// Run Framework Engine Loop Execution
gameTickLoop();
</script>
