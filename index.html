<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>F1 TURBO X - 3D Cockpit Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030307;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 4, 8, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 {
            font-size: 3.2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 15px;
            color: #00fff2;
            text-shadow: 0 0 15px rgba(0, 255, 242, 0.6), 0 0 30px rgba(255, 0, 127, 0.4);
            font-style: italic;
            font-weight: 900;
        }
        .panel {
            background: rgba(12, 12, 24, 0.9);
            border: 2px solid #ff007f;
            border-radius: 14px;
            padding: 20px;
            width: 85%;
            max-width: 680px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .full-width { grid-column: span 2; }
        .setting-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; text-transform: uppercase; color: #8f93b5; letter-spacing: 1px; }
        select, button {
            background: #090914;
            border: 1px solid #00fff2;
            color: #fff;
            padding: 10px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        select:focus, button:hover {
            background: #00fff2;
            color: #05050a;
            box-shadow: 0 0 10px rgba(0, 255, 242, 0.5);
        }
        .btn-prime { background: #ff007f; border: none; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .btn-prime:hover { background: #fff; color: #ff007f; box-shadow: 0 0 15px #fff; }
        
        /* Heads Up Display (HUD) */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }
        .hud-card {
            background: rgba(5, 5, 10, 0.75);
            padding: 8px 16px;
            border-bottom: 3px solid #ff007f;
            border-radius: 4px;
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #ff007f;
        }
        #btn-settings-trigger {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 6;
            background: rgba(10, 10, 20, 0.8);
            border: 1px solid #00fff2;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* Input Controls Interface Overlay */
        #touch-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 25px 40px;
            pointer-events: none;
        }
        .ctrl-btn {
            width: 85px;
            height: 85px;
            background: rgba(5, 5, 10, 0.6);
            border: 2px solid rgba(0, 255, 242, 0.5);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            color: #00fff2;
            box-shadow: 0 0 10px rgba(0, 255, 242, 0.2);
        }
        .ctrl-btn:active { background: rgba(0, 255, 242, 0.3); color: #fff; border-color: #fff; }
        .ctrl-group { display: flex; gap: 20px; pointer-events: none; }
        #countdown {
            position: absolute;
            font-size: 7.5rem;
            font-weight: 900;
            color: #00fff2;
            text-shadow: 0 0 25px #00fff2;
            z-index: 3;
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-screen" class="screen">
        <h1>F1 TURBO X : 3D</h1>
        <div class="panel">
            <div class="setting-group">
                <label>F1 Chassis Preset</label>
                <select id="select-car">
                    <option value="SPEED">V10 SPEEDSTER (Top Speed)</option>
                    <option value="TURBO">TURBO CHARGED (Acceleration)</option>
                    <option value="GRIP">APEX MAGNET (Cornering Grip)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Grid Competitors</label>
                <select id="select-ai">
                    <option value="1">1 Opponent</option>
                    <option value="3" selected>3 Opponents</option>
                    <option value="5">5 Opponents</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Input Control Mapping</label>
                <select id="select-controls">
                    <option value="TOUCH">Touch Interface D-Pad</option>
                    <option value="TILT">Device Tilt (Gyroscope)</option>
                    <option value="SWIPE">Horizontal Swiping</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Grid AI Sub-System</label>
                <select id="select-aggression">
                    <option value="OFF">Standard Racing Lines</option>
                    <option value="ON">Aggressive Block & Ram</option>
                </select>
            </div>
            <button id="btn-start" class="btn-prime full-width">Start Grand Prix</button>
        </div>
    </div>

    <div id="settings-modal" class="screen hidden">
        <h1>System Override</h1>
        <div class="panel">
            <div class="setting-group full-width">
                <label>On-the-fly Controls Switch</label>
                <select id="runtime-controls">
                    <option value="TOUCH">Touch Interface D-Pad</option>
                    <option value="TILT">Device Tilt (Gyroscope)</option>
                    <option value="SWIPE">Horizontal Swiping</option>
                </select>
            </div>
            <div class="setting-group full-width">
                <label>AI Tactics Adjuster</label>
                <select id="runtime-aggression">
                    <option value="OFF">Standard Racing Lines</option>
                    <option value="ON">Aggressive Block & Ram</option>
                </select>
            </div>
            <button id="btn-resume" class="btn-prime">Resume Race</button>
            <button id="btn-restart" class="btn-prime" style="background:#310a1b; border-color:#ff007f;">Abort to Main Menu</button>
        </div>
    </div>

    <button id="btn-settings-trigger" class="hidden">⚙️</button>
    <div id="hud" class="hidden">
        <div class="hud-card" id="hud-pos">POS: 1 / 4</div>
        <div class="hud-card" id="hud-lap">LAP: 1 / 3</div>
        <div class="hud-card" id="hud-speed">0 KM/H</div>
        <div class="hud-card" id="hud-coins">CREDITS: 0</div>
    </div>

    <button id="camera-toggle" class="hidden" style="position: absolute; top: 12px; left: 12px; z-index: 6; background: rgba(10,10,20,0.8); border: 1px solid #ff007f; color: #fff; padding: 8px 12px; border-radius: 4px; font-weight: bold; font-size: 0.8rem;">CAMERA: COCKPIT</button>

    <div id="countdown">3</div>

    <div id="touch-overlay">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-brake">🛑</div>
            <div class="ctrl-btn" id="btn-gas">⚡</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
/**
 * F1 TURBO X - ADVANCED PERSPECTIVE 3D RENDER ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let isControllable = false;
let currentCameraMode = 'COCKPIT'; // Alternate: 'BUMPER'

// System Configurations State
let config = { carType: 'SPEED', aiCount: 3, controlScheme: 'TOUCH', aiAggressive: 'OFF' };
let inputs = { left: false, right: false, gas: false, brake: false };
let tiltX = 0, touchStartX = 0;

// Game Tracking Diagnostics
let playerProgress = 0; 
let playerX = 0; // Displacement relative to center of road (-1 to 1)
let playerSpeed = 0;
let maxSpeed = 240;
let playerLap = 1;
let totalLaps = 3;
let internalCredits = 0;
let trackLength = 0;

let opponents = [];
let roadSegments = [];
let mapWaypoints = []; // Dynamic nodes vector for custom scalable map
let screenWidth = 1024;
let screenHeight = 768;

function resizeViewport() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    screenWidth = canvas.width;
    screenHeight = canvas.height;
}
window.addEventListener('resize', resizeViewport);
resizeViewport();

/**
 * MATHEMATICAL PERSPECTIVE SEGMENT PATTERNS (DESIGNED SHAPE LINES)
 */
function buildRaceTrack3D() {
    roadSegments = [];
    
    // Track 1 Construction - Sharp Corner Blocks & Alternating Straights
    addTrackSection(120, 0);       // Start/Finish Straight
    addTrackSection(80, 0.03);    // Sweep Right
    addTrackSection(60, -0.05);   // Sharp Left Apex Corner
    addTrackSection(150, 0);      // High Speed Straightaway
    addTrackSection(90, 0.06);     // Highly Compressed Hairpin Right
    addTrackSection(100, -0.02);  // Light Left Transition
    addTrackSection(110, 0);      // Return Stretch
    
    trackLength = roadSegments.length * 200; // Total linear distance scale
    calculateMiniMapSkeleton();
}

function addTrackSection(numSegments, curveIntensity) {
    for (let i = 0; i < numSegments; i++) {
        // Distribute periodic coins or powerups onto random lanes
        let asset = null;
        if (i % 14 === 0 && Math.random() < 0.7) asset = { type: 'COIN', lane: (Math.random() * 1.4 - 0.7) };
        else if (i % 38 === 0) asset = { type: Math.random() < 0.5 ? 'NITRO' : 'SHIELD', lane: (Math.random() * 1.2 - 0.6) };

        roadSegments.push({
            index: roadSegments.length,
            curve: curveIntensity,
            asset: asset,
            color: Math.floor(roadSegments.length / 3) % 2 === 0 ? { road: '#151522', kerb: '#ff0044', line: '#fff' } : { road: '#10101b', kerb: '#ffffff', line: '#000' }
        });
    }
}

function calculateMiniMapSkeleton() {
    mapWaypoints = [];
    let cx = 0, cy = 0, angle = 0;
    roadSegments.forEach((seg, idx) => {
        angle += seg.curve * 0.04;
        cx += Math.sin(angle) * 3;
        cy -= Math.cos(angle) * 3;
        if (idx % 10 === 0) mapWaypoints.push({ x: cx, y: cy });
    });
}

/**
 * ENGINE GAME LOOP REGISTRARS & INITIALIZATION
 */
function startRaceSequence() {
    buildRaceTrack3D();
    
    playerProgress = 0;
    playerX = 0;
    playerSpeed = 0;
    playerLap = 1;
    internalCredits = 0;

    // Build Competitors Dynamic Vectors
    opponents = [];
    let aiTotal = parseInt(config.aiCount);
    for (let i = 0; i < aiTotal; i++) {
        opponents.push({
            id: i + 1,
            progress: 4000 + (i * 2500),
            laneX: (i % 2 === 0 ? -0.5 : 0.5),
            speed: 160 + Math.random() * 40,
            color: `hsl(${(i * 75) % 360}, 95%, 50%)`
        });
    }

    // Toggle Visibility Layers
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('settings-modal').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('btn-settings-trigger').classList.remove('hidden');
    document.getElementById('camera-toggle').classList.remove('hidden');

    document.getElementById('touch-overlay').style.display = config.controlScheme === 'TOUCH' ? 'flex' : 'none';
    
    isControllable = false;
    let countNode = document.getElementById('countdown');
    countNode.style.display = 'block';
    let val = 3;
    countNode.innerText = val;

    let timer = setInterval(() => {
        val--;
        if (val === 0) {
            countNode.innerText = "GO!";
            isControllable = true;
        } else if (val < 0) {
            clearInterval(timer);
            countNode.style.display = 'none';
        } else {
            countNode.innerText = val;
        }
    }, 1000);
}

/**
 * CORE GRAPHICS PERSPECTIVE TRANSFORMATIONS
 */
function render3DViewPipeline() {
    ctx.clearRect(0, 0, screenWidth, screenHeight);

    // 1. Draw Adaptive Horizon Skies & Synthetic Grandstands Background
    let playerSegmentIndex = Math.floor(playerProgress / 200) % roadSegments.length;
    let activeSegment = roadSegments[playerSegmentIndex];
    
    // Draw Sky Backdrop Box
    ctx.fillStyle = '#060614';
    ctx.fillRect(0, 0, screenWidth, screenHeight * 0.5);
    
    // Synthetic Grandstands / Chairs Patterns
    ctx.fillStyle = '#221133';
    ctx.fillRect(0, screenHeight * 0.44, screenWidth, screenHeight * 0.06);
    ctx.fillStyle = '#ff0055';
    for (let x = 0; x < screenWidth; x += 16) {
        ctx.fillRect(x + (activeSegment.curve * -200 % 16), screenHeight * 0.44, 6, 8); // Animated Crowd Dots
    }

    // Ground Canvas Strip
    ctx.fillStyle = '#0a190a';
    ctx.fillRect(0, screenHeight * 0.5, screenWidth, screenHeight * 0.5);

    // 2. Process Pseudo-3D Perspective Mathematical Rendering Projection
    let currentSegmentIndex = Math.floor(playerProgress / 200);
    let cumulativeCurve = 0;
    let maxRenderDepth = 80;

    let projectedRoadLines = [];

    for (let i = 0; i < maxRenderDepth; i++) {
        let seg = roadSegments[(currentSegmentIndex + i) % roadSegments.length];
        if (!seg) continue;

        let z1 = (currentSegmentIndex + i) * 200 - playerProgress;
        if (z1 <= 0) z1 = 1; // Safeguard division-by-zero crashes

        cumulativeCurve += seg.curve;

        // Apply Perspective Coordinates
        let camHeight = 1200;
        let scale = 1.8 / (z1 / camHeight);
        let roadY = screenHeight * 0.5 + (camHeight / z1) * (screenHeight * 0.5) * 0.12;
        let roadWidth = 450 * scale;
        let roadCenterX = screenWidth * 0.5 + (cumulativeCurve * 15 * scale) - (playerX * roadWidth);

        projectedRoadLines.push({ y: roadY, w: roadWidth, x: roadCenterX, segment: seg, scaleFactor: scale });
    }

    // Render perspective polygons backward (from sky boundary down to bumper viewport)
    for (let i = projectedRoadLines.length - 2; i >= 0; i--) {
        let p1 = projectedRoadLines[i + 1];
        let p2 = projectedRoadLines[i];

        if (p1.y >= screenHeight || p2.y >= screenHeight || p1.y <= screenHeight * 0.48) continue;

        // Render Road Asphalt Area Surface
        ctx.fillStyle = p2.segment.color.road;
        ctx.beginPath();
        ctx.moveTo(p1.x - p1.w, p1.y);
        ctx.lineTo(p1.x + p1.w, p1.y);
        ctx.lineTo(p2.x + p2.w, p2.y);
        ctx.lineTo(p2.x - p2.w, p2.y);
        ctx.closePath();
        ctx.fill();

        // Outer Neon Boundary Kerbs / Rumble Strips
        let kerbW1 = p1.w * 0.12, kerbW2 = p2.w * 0.12;
        ctx.fillStyle = p2.segment.color.kerb;
        
        // Left Edge Strip Line
        ctx.beginPath();
        ctx.moveTo(p1.x - p1.w - kerbW1, p1.y); ctx.lineTo(p1.x - p1.w, p1.y);
        ctx.lineTo(p2.x - p2.w, p2.y); ctx.lineTo(p2.x - p2.w - kerbW2, p2.y);
        ctx.closePath(); ctx.fill();

        // Right Edge Strip Line
        ctx.beginPath();
        ctx.moveTo(p1.x + p1.w, p1.y); ctx.lineTo(p1.x + p1.w + kerbW1, p1.y);
        ctx.lineTo(p2.x + p2.w + kerbW2, p2.y); ctx.lineTo(p2.x + p2.w, p2.y);
        ctx.closePath(); ctx.fill();

        // Render Operational Race Assets (Coins/Powerups)
        if (p2.segment.asset) {
            let itemX = p2.x + (p2.segment.asset.lane * p2.w);
            let itemSize = 14 * p2.scaleFactor;
            if (itemSize > 1) {
                ctx.save();
                ctx.shadowBlur = 15;
                if (p2.segment.asset.type === 'COIN') {
                    ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700';
                    ctx.beginPath(); ctx.arc(itemX, p2.y - itemSize, itemSize, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = '#ff007f'; ctx.shadowColor = '#ff007f';
                    ctx.fillRect(itemX - itemSize, p2.y - itemSize * 2, itemSize * 2, itemSize * 2);
                }
                ctx.restore();
            }
        }
    }

    // 3. Render Competitors (AI Vehicles) inside 3D Perspective Pipeline
    opponents.forEach(ai => {
        let aiSegIndex = Math.floor(ai.progress / 200);
        if (aiSegIndex >= currentSegmentIndex && aiSegIndex < currentSegmentIndex + maxRenderDepth) {
            let depthOffset = aiSegIndex - currentSegmentIndex;
            let line = projectedRoadLines[depthOffset];
            if (line) {
                let carX = line.x + (ai.laneX * line.w);
                let carW = 68 * line.scaleFactor;
                let carH = 34 * line.scaleFactor;
                let carY = line.y;

                if (carW > 4 && carY < screenHeight) {
                    ctx.save();
                    ctx.shadowBlur = 10; ctx.shadowColor = ai.color;
                    
                    // Aerodynamic pointed F1 Chassis Structure Base
                    ctx.fillStyle = ai.color;
                    ctx.beginPath();
                    ctx.moveTo(carX - carW/2, carY);
                    ctx.lineTo(carX, carY - carH);
                    ctx.lineTo(carX + carW/2, carY);
                    ctx.closePath(); ctx.fill();

                    // Rear spoiler markings assembly
                    ctx.fillStyle = '#111';
                    ctx.fillRect(carX - carW*0.6, carY - carH, carW * 1.2, carH * 0.2);
                    ctx.restore();
                }
            }
        }
    });

    // 4. Render Active Cockpit / Dashboard Framework Layout HUD Overlay
    if (currentCameraMode === 'COCKPIT') {
        renderCockpitLayer();
    }

    // 5. Render Professional High-Vis Mini-Map Node Engine Overlay
    renderMiniMapOverlay();
}

/**
 * COCKPIT ARTISTIC ASYMPTOTIC CANVAS ASSEMBLER
 */
function renderCockpitLayer() {
    ctx.save();
    
    // Steering offset response matrix
    let turnOffset = 0;
    if (inputs.left) turnOffset = -40;
    if (inputs.right) turnOffset = 40;

    let baseH = screenHeight * 0.72;

    // Outer Carbon-Fiber Structural Cockpit Border
    ctx.fillStyle = '#111116';
    ctx.beginPath();
    ctx.moveTo(0, screenHeight);
    ctx.lineTo(screenWidth * 0.2, baseH);
    ctx.lineTo(screenWidth * 0.8, baseH);
    ctx.lineTo(screenWidth, screenHeight);
    ctx.closePath();
    ctx.fill();

    // Central Digital Dashboard HUD Enclosure
    ctx.fillStyle = '#1b1b22';
    ctx.strokeStyle = '#00fff2';
    ctx.lineWidth = 3;
    ctx.fillRect(screenWidth*0.38, baseH + 10, screenWidth*0.24, 70);
    ctx.strokeRect(screenWidth*0.38, baseH + 10, screenWidth*0.24, 70);

    // Digital RPM Bars / Speed readouts
    ctx.fillStyle = '#00fff2';
    ctx.font = "bold 1.1rem monospace";
    ctx.fillText(`GEAR: 6`, screenWidth*0.4, baseH + 35);
    ctx.fillStyle = '#ff007f';
    let rmpBarWidth = (playerSpeed / maxSpeed) * 100;
    ctx.fillRect(screenWidth*0.4, baseH + 50, rmpBarWidth, 14);

    // Render Movable F1 Steering Wheel Unit
    ctx.translate(screenWidth * 0.5 + (turnOffset * 0.2), screenHeight * 0.9);
    ctx.rotate(turnOffset * 0.012);

    // Wheel Circle Rim Ring
    ctx.lineWidth = 32;
    ctx.strokeStyle = '#25252b';
    ctx.beginPath();
    ctx.arc(0, 0, 110, 0, Math.PI * 2);
    ctx.stroke();

    // Center Core Controller Housing Block
    ctx.fillStyle = '#0f0f14';
    ctx.fillRect(-60, -40, 120, 80);
    
    // Neon Operations Quick Buttons
    ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(-40, -15, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00fff2'; ctx.beginPath(); ctx.arc(40, -15, 8, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

/**
 * HIGH INTERACTIVITY MINI-MAP GRAPHICS ENGINE OVERLAY
 */
function renderMiniMapOverlay() {
    ctx.save();
    
    // Position Map Frame on Right Bottom Base Sector
    let mapSize = 120;
    let mx = screenWidth - mapSize - 25;
    let my = screenHeight - mapSize - (currentCameraMode === 'COCKPIT' ? 140 : 40);

    // Render Translucent Map Background Container box
    ctx.fillStyle = 'rgba(5, 5, 10, 0.7)';
    ctx.strokeStyle = '#ff007f';
    ctx.lineWidth = 2;
    ctx.fillRect(mx - 10, my - 10, mapSize + 20, mapSize + 20);
    ctx.strokeRect(mx - 10, my - 10, mapSize + 20, mapSize + 20);

    // Normalize coordinates mapping bounds
    ctx.strokeStyle = 'rgba(0, 255, 242, 0.4)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    
    mapWaypoints.forEach((wp, idx) => {
        // Linear scale matching constraints safely
        let wx = mx + mapSize/2 + wp.x * 0.6;
        let wy = my + mapSize/2 + wp.y * 0.6;
        if (idx === 0) ctx.moveTo(wx, wy);
        else ctx.lineTo(wx, wy);
    });
    ctx.closePath();
    ctx.stroke();

    // Calculate & project Current Player Node Positioning
    let playerIdx = Math.floor((playerProgress / trackLength) * mapWaypoints.length) % mapWaypoints.length;
    let pNode = mapWaypoints[playerIdx];
    if (pNode) {
        ctx.fillStyle = '#00fff2'; // Blue Dot
        ctx.shadowBlur = 10; ctx.shadowColor = '#00fff2';
        ctx.beginPath();
        ctx.arc(mx + mapSize/2 + pNode.x * 0.6, my + mapSize/2 + pNode.y * 0.6, 6, 0, Math.PI*2);
        ctx.fill();
    }

    // Loop through Opponents mapping positions
    opponents.forEach(ai => {
        let aiIdx = Math.floor((ai.progress / trackLength) * mapWaypoints.length) % mapWaypoints.length;
        let aiNode = mapWaypoints[aiIdx];
        if (aiNode) {
            ctx.fillStyle = '#ff003c'; // Red Dot for opponents
            ctx.shadowBlur = 8; ctx.shadowColor = '#ff003c';
            ctx.beginPath();
            ctx.arc(mx + mapSize/2 + aiNode.x * 0.6, my + mapSize/2 + aiNode.y * 0.6, 5, 0, Math.PI*2);
            ctx.fill();
        }
    });

    ctx.restore();
}

/**
 * 60FPS PHYSICS PROCESSING LOOP
 */
function runRacePhysicsCalculations() {
    if (gameState !== 'RUNNING' || !isControllable) return;

    // 1. Process Input Speeds Accelerations Models
    if (inputs.gas) {
        playerSpeed = Math.min(playerSpeed + 2.5, maxSpeed);
    } else if (inputs.brake) {
        playerSpeed = Math.max(playerSpeed - 4.5, 0);
    } else {
        playerSpeed = Math.max(playerSpeed - 1.2, 0);
    }

    playerProgress += playerSpeed * 0.75;

    // 2. Lateral Turning Displacements Calculations
    let currentSegIndex = Math.floor(playerProgress / 200) % roadSegments.length;
    let currentSeg = roadSegments[currentSegIndex];

    if (config.controlScheme === 'TILT') {
        playerX += tiltX * 0.04;
    } else {
        if (inputs.left) playerX -= 0.045;
        if (inputs.right) playerX += 0.045;
    }

    // Auto apply centrifugal force vector pull during high curve zones
    if (currentSeg) {
        playerX -= (playerSpeed / maxSpeed) * currentSeg.curve * 1.8;
    }

    // Prevent cross breaching outer track lanes boundaries limits
    if (playerX < -1.4) playerX = -1.4;
    if (playerX > 1.4) playerX = 1.4;

    // Check if player driving off-road (Grass penalty zone slows down vehicle)
    if (Math.abs(playerX) > 1.0) {
        playerSpeed = Math.max(playerSpeed - 4.0, 60);
    }

    // 3. Process Active Items Collisions Inside Canvas Array Registry
    if (currentSeg && currentSeg.asset) {
        let dX = Math.abs(playerX - currentSeg.asset.lane);
        if (dX < 0.25) {
            if (currentSeg.asset.type === 'COIN') {
                internalCredits += 50;
            } else if (currentSeg.asset.type === 'NITRO') {
                playerSpeed = Math.min(playerSpeed + 60, maxSpeed * 1.2);
            }
            currentSeg.asset = null; // Consume collectible slot
        }
    }

    // 4. Update AI Fleet positions processing loop
    opponents.forEach(ai => {
        let aiSegIndex = Math.floor(ai.progress / 200) % roadSegments.length;
        let aiSeg = roadSegments[aiSegIndex];
        
        // Add random variations or aggressive blocking lines adjustments
        if (config.aiAggressive === 'ON' && Math.random() < 0.1) {
            ai.laneX += (playerX - ai.laneX) * 0.12;
        }

        ai.progress += ai.speed * 0.72;

        // Process Inter-vehicle Crash impacts rules logic
        if (Math.floor(ai.progress / 200) === currentSegIndex) {
            if (Math.abs(playerX - ai.laneX) < 0.3) {
                playerSpeed = Math.max(playerSpeed * 0.5, 40); // Hard penalty breakdown impact
                ai.speed *= 0.6;
            }
        }
    });

    // 5. Track Progression Multi-Lap Boundaries Counter Check
    if (playerProgress >= trackLength) {
        playerProgress = 0;
        playerLap++;
        if (playerLap > totalLaps) {
            gameState = 'MENU';
            alert(`GRAND PRIX COMPLETE! Credits Earned: ${internalCredits}`);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('camera-toggle').classList.add('hidden');
            document.getElementById('btn-settings-trigger').classList.add('hidden');
            document.getElementById('touch-overlay').style.display = 'none';
            document.getElementById('menu-screen').classList.remove('hidden');
        }
    }
}

/**
 * ENGINE FRAME REGISTRAR CONTROL TICKS
 */
function engineCoreLifecycleTick() {
    runRacePhysicsCalculations();
    render3DViewPipeline();

    // Map Telemetry outputs direct inside HUD Document layout bindings
    if (gameState === 'RUNNING') {
        document.getElementById('hud-speed').innerText = `${Math.round(playerSpeed)} KM/H`;
        document.getElementById('hud-coins').innerText = `CREDITS: ${internalCredits}`;
        document.getElementById('hud-lap').innerText = `LAP: ${playerLap} / ${totalLaps}`;
        
        // Calculate Position Placement rank live
        let rank = 1;
        opponents.forEach(ai => { if (ai.progress > playerProgress) rank++; });
        document.getElementById('hud-pos').innerText = `POS: ${rank} / ${opponents.length + 1}`;
    }

    requestAnimationFrame(engineCoreLifecycleTick);
}

/**
 * COMPREHENSIVE INPUT ACTION INTERFACE CONFIGURATIONS
 */
document.getElementById('btn-start').addEventListener('click', () => {
    config.carType = document.getElementById('select-car').value;
    config.aiCount = document.getElementById('select-ai').value;
    config.controlScheme = document.getElementById('select-controls').value;
    config.aiAggressive = document.getElementById('select-aggression').value;

    gameState = 'RUNNING';
    startRaceSequence();
});

// Realtime dynamic Camera toggle interface switch click handler
const camBtn = document.getElementById('camera-toggle');
camBtn.addEventListener('click', () => {
    if (currentCameraMode === 'COCKPIT') {
        currentCameraMode = 'BUMPER';
        camBtn.innerText = "CAMERA: BUMPER CAM";
    } else {
        currentCameraMode = 'COCKPIT';
        camBtn.innerText = "CAMERA: COCKPIT";
    }
});

// Runtime Settings System Override Trigger Listeners
const triggerBtn = document.getElementById('btn-settings-trigger');
const modal = document.getElementById('settings-modal');

triggerBtn.addEventListener('click', () => {
    gameState = 'PAUSED';
    document.getElementById('runtime-controls').value = config.controlScheme;
    document.getElementById('runtime-aggression').value = config.aiAggressive;
    modal.classList.remove('hidden');
});

document.getElementById('btn-resume').addEventListener('click', () => {
    config.controlScheme = document.getElementById('runtime-controls').value;
    config.aiAggressive = document.getElementById('runtime-aggression').value;
    document.getElementById('touch-overlay').style.display = config.controlScheme === 'TOUCH' ? 'flex' : 'none';
    modal.classList.add('hidden');
    gameState = 'RUNNING';
});

document.getElementById('btn-restart').addEventListener('click', () => {
    modal.classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    camBtn.classList.add('hidden');
    triggerBtn.classList.add('hidden');
    document.getElementById('touch-overlay').style.display = 'none';
    gameState = 'MENU';
    document.getElementById('menu-screen').classList.remove('hidden');
});

// Keyboard fallback interface actions (For desktop testing diagnostics)
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = true;
    if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = true;
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w') inputs.gas = false;
    if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = false;
});

// Screen D-Pad Touch Interfaces Handlers Registration
const configureTouchBind = (id, prop) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[prop] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[prop] = false; });
};
configureTouchBind('btn-left', 'left');
configureTouchBind('btn-right', 'right');
configureTouchBind('btn-gas', 'gas');
configureTouchBind('btn-brake', 'brake');

// Mobile Gyro Sensor Linkage Drivers Event Handlers
if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
        let rawTilt = e.gamma; // Landscape orientation mapping tracker bounds
        if (window.orientation === 90) rawTilt = -e.beta;
        else if (window.orientation === -90) rawTilt = e.beta;
        
        if (Math.abs(rawTilt) > 3) tiltX = (rawTilt / 35);
        else tiltX = 0;
    }, true);
}

// Swipe Gesture Analyzer Layout Core Linkage
window.addEventListener('touchstart', e => {
    if (config.controlScheme !== 'SWIPE') return;
    touchStartX = e.touches[0].clientX;
    inputs.gas = true; // Auto accelerate
}, {passive: true});

window.addEventListener('touchmove', e => {
    if (config.controlScheme !== 'SWIPE' || !touchStartX) return;
    let diff = e.touches[0].clientX - touchStartX;
    if (diff < -25) { inputs.left = true; inputs.right = false; }
    else if (diff > 25) { inputs.right = true; inputs.left = false; }
    else { inputs.left = false; inputs.right = false; }
}, {passive: true});

window.addEventListener('touchend', () => {
    if (config.controlScheme !== 'SWIPE') return;
    inputs.left = false; inputs.right = false; inputs.gas = false;
    touchStartX = 0;
});

// Run Central Execution Pipeline Loop
engineCoreLifecycleTick();
</script>
