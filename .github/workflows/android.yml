name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova & Build Platform
        run: |
          npm install -g cordova
          cordova create build_dir com.cyberpunk.drive DriveInCyberpunk
          cd build_dir
          cordova platform add android
          rm -rf www/*
          cp -r ../index.html www/
          cp ../config.xml .
          # Safe icon check
          if [ -f "../icon.png" ]; then cp ../icon.png .; else echo "No icon found"; gpt_icon=false; fi
          
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Debug APK
        run: |
          cd build_dir
          cordova build android --device

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveInCyberpunk-APK
          path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk
